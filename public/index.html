
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Dada 2D</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090d16;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 25px;
    font-size: 22px;
    font-weight: bold;
}

.hero {
    min-height: 75vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

h1 {
    font-size: clamp(40px, 8vw, 75px);
    margin-bottom: 10px;
}

p {
    color: #aab3c5;
    max-width: 550px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}

.btn {
    padding: 16px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    color: white;
    background: #1769ff;
}

.btn.secondary {
    background: #202b40;
}

.btn:hover {
    opacity: 0.8;
}

footer {
    padding: 25px;
    color: #68748a;
}
</style>
</head>

<body>

<header>DON DADA 2D</header>

<section class="hero">

    <h1>ENTER THE FIGHT.</h1>

    <p>
        Experience the action. Challenge your opponents
        and fight your way to victory.
    </p>

    <div class="buttons">

        <a class="btn"
           href="game/index.html">
           PLAY IN BROWSER
        </a>

        <a class="btn secondary"
           href="YOUR_GITHUB_RELEASE_DOWNLOAD_URL">
           DOWNLOAD FOR PC
        </a>

    </div>

</section>

<footer>
    Don Dada 2D<br>Developed by Salim Eshan Isabirye<br>© 2026
</footer>

</body>
</html>
