<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Dada 2D</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #060911;
    background-image: 
        radial-gradient(circle at 50% 20%, rgba(23, 105, 255, 0.15), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.08), transparent 40%);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

header {
    padding: 32px 20px 10px;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e2e8f0;
}

.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
}

.badge {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(23, 105, 255, 0.12);
    border: 1px solid rgba(23, 105, 255, 0.3);
    border-radius: 20px;
    color: #4da6ff;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 20px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(2.75rem, 7vw, 5.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    color: #94a3b8;
    max-width: 520px;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 36px;
}

.buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 480px;
}

.btn {
    flex: 1;
    min-width: 200px;
    padding: 16px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: #ffffff;
    background: #1769ff;
    box-shadow: 0 4px 20px rgba(23, 105, 255, 0.35);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(23, 105, 255, 0.5);
    background: #2575ff;
}

.btn.secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: none;
}

.btn.secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.25);
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

footer {
    padding: 32px 20px;
    color: #64748b;
    font-size: 0.875rem;
    line-height: 1.6;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

footer strong {
    color: #94a3b8;
}
</style>
</head>

<body>

<header>DON DADA 2D</header>

<section class="hero">

    <div class="badge">2D Action Fighter</div>

    <h1>ENTER THE FIGHT.</h1>

    <p>
        Experience intense arcade combat. Challenge your opponents 
        and brawl your way to victory.
    </p>

    <div class="buttons">

        <a class="btn" href="game/index.html">
            PLAY IN BROWSER
        </a>

        <a class="btn secondary" href="https://github.com/eshantheyoung/don-dada-2d-live/releases/download/Don-Dada_2D_Windows/Don.Dada.2D.exe">
            DOWNLOAD FOR PC
        </a>

    </div>

</section>

<footer>
    <strong>Don Dada 2D</strong><br>
    Developed by Salim Eshan Isabirye<br>
    © 2026
</footer>

</body>
</html>
